[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bbgen"
version = "0.1.0"
description = "Breadboard layouts from YAML: a drawing, a build checklist and a wiring check"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
bbgen = "bbgen.cli:main"

[tool.setuptools]
packages = ["bbgen"]
