[package]
name = "bbgen"
version = "0.1.0"
edition = "2021"
description = "Breadboard layouts from YAML: a drawing, a build checklist and a wiring check"
license = "MIT"

[[bin]]
name = "bbgen"
path = "src/main.rs"

[dependencies]
foldhash = "0.2"
indexmap = "2"
md-5 = "0.10"
rayon = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unsafe-libyaml = "0.2"

[profile.release]
debug = 1

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
