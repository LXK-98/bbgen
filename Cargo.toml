[package]
name = "bbgen"
version = "0.1.0"
edition = "2021"
description = "Breadboard layouts from YAML: a drawing, a build checklist and a wiring check"
license = "MIT"
repository = "https://github.com/LXK-98/bbgen"
# its ELK comes from git, which crates.io doesn't take
publish = false

[[bin]]
name = "bbgen"
path = "src/main.rs"

[dependencies]
foldhash = "0.2"
indexmap = "2"
md-5 = "0.10"
rayon = "1"
# ELK (the Eclipse Layout Kernel) ported to Rust, for the schematic's layout (src/elk.rs); EPL-2.0
org-eclipse-elk-alg-layered = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.3" }
org-eclipse-elk-core = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.3" }
org-eclipse-elk-graph-json = { git = "https://github.com/openedges/elk-rs", tag = "v0.11.0+rs.3" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unsafe-libyaml = "0.2"

[profile.release]
debug = 1

[dev-dependencies]
flate2 = "1"
sha2 = "0.10"
