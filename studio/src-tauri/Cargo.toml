[package]
name = "bbgen-studio"
version = "0.1.0"
description = "Load a circuit, build it with bbgen, and inspect the breadboard"
license = "MIT"
edition = "2021"

[lib]
name = "bbgen_studio"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# the versions Tauri builds on: to take touchpad pinches from WebKitGTK (see `pinch_zooms_the_drawing`)
gio = "0.18"
glib = "0.18"
gtk = "0.18"
webkit2gtk = "2.0"
