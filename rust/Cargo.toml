[package]
name = "bbgen"
version = "0.1.0"
edition = "2021"
description = "Breadboard layouts from YAML (Rust port of bbgen, in progress)"
license = "MIT"

[[bin]]
name = "bbgen-rs"
path = "src/main.rs"

[dependencies]
foldhash = "0.2"
indexmap = "2"
md-5 = "0.10"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
unsafe-libyaml = "0.2"

[profile.release]
debug = 1
