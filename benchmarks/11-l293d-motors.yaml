title: DC motor driver (L293D)
notes:
  - "Tier 3. A Pico drives both halves of an L293D (enable + two inputs each); the motors run from their own
    supply on VCC2, the logic from the Pico's VBUS on VCC1. Pins by number (EN1,2 has a comma)."
parts:
  Pico: {symbol: MCU_Module:RaspberryPi_Pico}
  U1: {symbol: Driver_Motor:L293D}
  C1: {type: capacitor, value: 100nF, near: U1}
  C2: {type: electrolytic, value: 100uF}
  C3: {type: capacitor, value: 100nF, near: U1}
  J1: {type: offboard, title: Motor A, labels: [A+, A-]}
  J2: {type: offboard, title: Motor B, labels: [B+, B-]}
  J3: {type: offboard, title: Motor supply, labels: [VMOT, GND]}
nets:
  5V: [Pico.VBUS, U1.16, C1.1]
  VMOT: [J3.1, U1.8, C2.+, C3.1]
  GND: [Pico.GND, U1.GND, J3.2, C1.2, C2.-, C3.2]
  EN12: [Pico.GPIO10, U1.1]
  IN1: [Pico.GPIO11, U1.2]
  IN2: [Pico.GPIO12, U1.7]
  EN34: [Pico.GPIO13, U1.9]
  IN3: [Pico.GPIO14, U1.10]
  IN4: [Pico.GPIO15, U1.15]
  MA1: [U1.3, J1.1]
  MA2: [U1.6, J1.2]
  MB1: [U1.11, J2.1]
  MB2: [U1.14, J2.2]
