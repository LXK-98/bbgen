title: 555 + CD4017 LED chaser
notes:
  - "Tier 2. The 555 clocks a 4017 decade counter, which lights ten LEDs in turn; one shared cathode resistor."
  - "4xxx:4017 names no footprint, so it's given: the DIP-16."
