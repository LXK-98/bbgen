title: Pico traffic light
notes:
  - "Tier 2. Red, yellow and green LEDs on GPIO13-15 through 220R, and a pedestrian button from GPIO12 to
    GND (the Pico's own pull-up). The LEDs' colours come from color: on each."
  - "The button is a 4-pin DIP across the trench, as in 02."
parts:
  Pico: {symbol: MCU_Module:RaspberryPi_Pico}
  D1: {type: led, color: red}
  D2: {type: led, color: yellow}
  D3: {type: led, color: green}
  R1: {type: resistor, value: 220R}
  R2: {type: resistor, value: 220R}
  R3: {type: resistor, value: 220R}
  SW1: {type: dip, pins: 4, title: pedestrian button}
nets:
  RED: [Pico.GPIO13, R1.1]
  RED_LED: [R1.2, D1.A]
  YELLOW: [Pico.GPIO14, R2.1]
  YELLOW_LED: [R2.2, D2.A]
  GREEN: [Pico.GPIO15, R3.1]
  GREEN_LED: [R3.2, D3.A]
  BUTTON: [Pico.GPIO12, SW1.1]
  GND: {pins: [Pico.GND, D1.K, D2.K, D3.K, SW1.2], rail: -}
expect: {flex: 2, label_clashes: 0}  # three resistors off neighbouring Pico pins: two free rows on that side
