title: 4-digit 7-segment display, multiplexed
notes:
  - "Tier 4. A 74HC595 drives the eight segments through 220R; four PN2222As switch the common cathodes,
    one digit at a time, from GPIO6-9. TO-92_Inline_Wide for the transistors (see 08)."
