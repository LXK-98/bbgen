  Pico: {symbol: MCU_Module:RaspberryPi_Pico}
  U1: {symbol: 74xx:74HC595, footprint: Package_DIP:DIP-16_W7.62mm}
  DISP1: {symbol: Display_Character:CC56-12EWA}
  C1: {type: capacitor, value: 100nF, near: U1}
  R1: {type: resistor, value: 220R}
  R2: {type: resistor, value: 220R}
  R3: {type: resistor, value: 220R}
  R4: {type: resistor, value: 220R}
  R5: {type: resistor, value: 220R}
  R6: {type: resistor, value: 220R}
  R7: {type: resistor, value: 220R}
  R8: {type: resistor, value: 220R}
  Q1: {symbol: Transistor_BJT:PN2222A, footprint: Package_TO_SOT_THT:TO-92_Inline_Wide}
  R9: {type: resistor, value: 1k}
  Q2: {symbol: Transistor_BJT:PN2222A, footprint: Package_TO_SOT_THT:TO-92_Inline_Wide}
  R10: {type: resistor, value: 1k}
  Q3: {symbol: Transistor_BJT:PN2222A, footprint: Package_TO_SOT_THT:TO-92_Inline_Wide}
  R11: {type: resistor, value: 1k}
  Q4: {symbol: Transistor_BJT:PN2222A, footprint: Package_TO_SOT_THT:TO-92_Inline_Wide}
  R12: {type: resistor, value: 1k}
nets:
  3V3: {pins: [Pico.3V3, U1.VCC, U1./SRCLR, C1.1], rail: +}
  GND: {pins: [Pico.GND, U1.GND, U1./OE, C1.2, Q1.E, Q2.E, Q3.E, Q4.E], rail: -}
  SER: [Pico.GPIO2, U1.SER]
  SRCLK: [Pico.GPIO3, U1.SRCLK]
  RCLK: [Pico.GPIO4, U1.RCLK]
  SA: [U1.QA, R1.1]
  SEG_A: [R1.2, DISP1.a]
  SB: [U1.QB, R2.1]
  SEG_B: [R2.2, DISP1.b]
  SC: [U1.QC, R3.1]
  SEG_C: [R3.2, DISP1.c]
  SD: [U1.QD, R4.1]
  SEG_D: [R4.2, DISP1.d]
