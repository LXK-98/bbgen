title: LM386 audio amplifier
notes:
  - "Tier 2. The datasheet's gain-20 circuit: volume pot into pin 3, 250 uF to the speaker, a 10 R + 47 nF
    Zobel network, 10 uF on BYPASS. The LM386's pins share names (two -), so they go by number."
parts:
  U1: {symbol: Amplifier_Audio:LM386, footprint: Package_DIP:DIP-8_W7.62mm}
  RV1: {footprint: Potentiometer_THT:Potentiometer_Alps_RK09K_Single_Vertical, title: 10k volume}
  C1: {type: electrolytic, value: 250uF}
  R1: {type: resistor, value: 10R}
  C2: {type: capacitor, value: 47nF}
  C3: {type: electrolytic, value: 10uF}
  C4: {type: capacitor, value: 100nF, near: U1}
  C5: {type: electrolytic, value: 100uF}
  J1: {type: offboard, title: Audio in, labels: [IN, GND]}
  J2: {type: offboard, title: Speaker, labels: [SPK+, SPK-]}
  J3: {type: offboard, title: 9 V supply, labels: [9V, GND]}
nets:
  9V: [J3.1, U1.6, C4.1, C5.+]
  GND: [J3.2, U1.4, U1.2, RV1.1, J1.2, C2.2, C3.-, C4.2, C5.-, J2.2]
  IN: [J1.1, RV1.3]
  WIPER: [RV1.2, U1.3]
  OUT: [U1.5, C1.+, R1.1]
  ZOBEL: [R1.2, C2.1]
  SPEAKER: [C1.-, J2.1]
  BYPASS: [U1.7, C3.+]
