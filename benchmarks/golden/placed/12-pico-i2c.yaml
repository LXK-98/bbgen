title: Pico I2C bus (EEPROM + OLED + buttons)
notes:
- Tier 3. A 24LC256 EEPROM and a 0.91 in SSD1306 OLED share I2C0 (GPIO4/5) with 4.7k
  pull-ups; two buttons to 3V3 on GPIO14/15 (pull-downs in the Pico). Buttons are
  4-pin DIPs (see 02).
parts:
  Pico:
    symbol: MCU_Module:RaspberryPi_Pico
    at: g57
    rot: 180
  U1:
    symbol: Memory_EEPROM:24LC256
    footprint: Package_DIP:DIP-8_W7.62mm
    at: e22
    rot: 0
  OLED:
    symbol: Display_Graphic:ER_OLEDM0.91_1x-I2C
    at: f17
    rot: 90
  R1:
    type: resistor
    value: 4k7
    pins:
    - i18
    - i20
  R2:
    type: resistor
    value: 4k7
    pins:
    - i22
    - i24
  C1:
    type: capacitor
    value: 100nF
    near: U1
    pins:
    - top+21
    - top-21
  SW1:
    type: dip
    pins: 4
    title: button 1
    at: e35
    rot: 0
  SW2:
    type: dip
    pins: 4
    title: button 2
    at: f30
    rot: 180
nets:
  3V3:
    pins:
    - Pico.3V3
    - U1.VCC
    - OLED.VCC
    - R1.1
    - R2.1
    - C1.1
    - SW1.2
    - SW2.2
    rail: +
  GND:
    pins:
    - Pico.GND
    - U1.GND
    - U1.A0
    - U1.A1
    - U1.A2
    - U1.WP
    - OLED.GND
    - C1.2
    rail: '-'
  SDA:
  - Pico.GPIO4
  - U1.SDA
  - OLED.SDA
  - R1.2
  SCL:
  - Pico.GPIO5
  - U1.SCL
  - OLED.SCL
  - R2.2
  BTN1:
  - Pico.GPIO14
  - SW1.1
  BTN2:
  - Pico.GPIO15
  - SW2.1
autowire: true
_placed:
- Pico
- U1
- OLED
- SW1
- SW2
- R1
- R2
- C1
