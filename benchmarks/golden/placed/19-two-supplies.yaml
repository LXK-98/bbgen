    at: d59
    rot: 90
  C1:
    type: capacitor
    value: 100nF
    near: U1
    pins:
    - b61
    - b59
  C2:
    type: electrolytic
    value: 10uF
    near: U1
    pins:
    - top+58
    - top-58
  R1:
    type: resistor
    value: 330R
    pins:
    - bot+59
    - i59
  D1:
    type: led
    color: green
    pins:
    - f59
    - e59
  R2:
    type: resistor
    value: 220R
    pins:
    - top+51
    - a51
  D2:
    type: led
    color: blue
    pins:
    - b52
    - top-52
nets:
