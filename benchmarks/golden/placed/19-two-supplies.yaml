title: 5 V and 3.3 V side by side
notes:
- Tier 2. A bench 5 V supply and an LD1117 regulating 3.3 V from it, each with its
  input or output cap and an LED showing it's on. Two voltages, so each gets a + rail
  of its own; the grounds share the - rails.
