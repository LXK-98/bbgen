title: 'iPod LCD driver, M2: rails, reference and the 18-bit bus'
notes:
- 'Tier 4. From ipod-classic-reverse-engineering docs/BREADBOARD.md 3a-3b: two LDOs
  and a buffered, trimmable reference, on the SMD-to-DIP adapters (SOT-23-5 pad 5
  ASSUMED on adapter pin 6). M2 adds 3c-3e: three SN74LVC8T245 level-shift the 18
  data lanes, D/C, /WR and /CS from 3V3 to VDDIO, an SN74LVC1T45 shifts TE up to GP27,
  and P30/P32 get 10k pull-ups to VDDIO.'
- 'ASSUMED: the TSSOP-24 parts sit on 0.6 in wide DIP-24 adapters, pad n on pin n.
  The circuit is too big for one board, so it takes two.'
