    - U1.GND
    - C1.-
    - C2.2
    - C3.2
    - D1.K
    rail: '-'
  DIS:
  - U1.DISCH
  - RA.2
  - RB.1
  TIMING:
  - U1.THRES
  - U1.TRIG
  - RB.2
  - C1.+
  CTRL:
  - U1.CONT
  - C2.1
  OUT:
  - U1.OUT
  - R3.1
  LED:
  - R3.2
  - D1.A
