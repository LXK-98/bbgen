title: 555 LED blinker
notes:
- 'Tier 2. The classic astable: about 1 Hz with RA 1k, RB 10k, C1 10 uF (NE555 from
  KiCad).'
parts:
  U1:
    symbol: Timer:NE555P
    at: f55
    rot: 180
  RA:
    type: resistor
    value: 1k
    pins:
    - c55
    - c54
  RB:
    type: resistor
    value: 10k
    pins:
    - a54
    - a56
  C1:
    type: electrolytic
    value: 10uF
    pins:
    - i54
    - i55
  C2:
    type: capacitor
    value: 10nF
    pins:
    - b52
    - bot-52
  C3:
    type: capacitor
    value: 100nF
    near: U1
    pins:
    - top+54
    - top-54
  R3:
    type: resistor
    value: 330R
    pins:
    - h53
    - h51
  D1:
    type: led
    pins:
    - j51
    - top-51
  J1:
    type: offboard
    title: Bench supply
    labels:
    - 5V
    - GND
