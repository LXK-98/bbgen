- 'Tier 2. The datasheet''s gain-20 circuit: volume pot into pin 3, 250 uF to the
  speaker, a 10 R + 47 nF Zobel network, 10 uF on BYPASS. The LM386''s pins share
  names (two -), so they go by number.'
