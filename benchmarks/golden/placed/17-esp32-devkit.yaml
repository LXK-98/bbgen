title: ESP32 DevKitC with sensor, LED, button and OLED
notes:
- Tier 4. An ESP32-DevKitC (38 pins) reads a DS18B20 on IO15 (4.7k pull-up), lights
  an LED on IO2, reads a button on IO4 (10k pull-up) and drives an SSD1306 OLED on
  I2C (IO21/IO22).
- The DevKitC isn't in KiCad's library, so it is a 38-pin DIP with its pin rows 1.0
  in apart. It covers a whole breadboard's width, so it sits across two boards snapped
  together long side to long side, one row of pins in each. Pin 1 is 3V3, counting
  down the left row.
