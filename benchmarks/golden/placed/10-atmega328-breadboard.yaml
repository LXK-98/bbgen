title: Arduino on a breadboard (ATmega328P)
notes:
- Tier 3. ATmega328P-P with a 16 MHz crystal and 22 pF caps, 10k reset pull-up, 100
  nF auto-reset from the FTDI adapter's DTR, decoupling on VCC and AVCC, and the D13
  LED.
- 'Gap: KiCad''s HC-49 crystal footprints are off the 0.1 in grid (4.88 mm), so the
  crystal is a two-lead part (drawn as a capacitor).'
