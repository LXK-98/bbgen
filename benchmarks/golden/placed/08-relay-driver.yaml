title: Transistor relay driver
notes:
- Tier 2. GPIO16 drives a PN2222A through 1k; the transistor switches the relay coil
  from VBUS, a 1N4148 across the coil catches the flyback. An LED shows the coil is
  on.
- 'KiCad''s PN2222A footprint (TO-92_Inline) is 1.27 mm pitch, off the grid: TO-92_Inline_Wide
  instead.'
- 'Relay: a Standex Meder DIP reed relay (SPST, closing), which sits across the trench
  like a DIP-14. Coil on pins 2 and 6, contacts on 1 (and 14) and 7 (and 8). (An Omron
  G5V-1''s pin rows are 0.2 in apart: on a breadboard two of its pins always share
  a strip.)'
