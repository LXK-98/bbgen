title: Pico button and LED
notes:
- 'Tier 1. A button with a pull-down on GPIO28, an LED on GPIO27: on the same side
  of the Pico as its 3V3 and a GND pin, as you''d pick them to build it.'
- 'Gap: KiCad''s 6 mm tactile switch (SW_PUSH_6mm) is off the 0.1 in grid, so the
  switch is a 4-pin DIP across the trench. Pressing joins pin 1 to pin 2; bbgen doesn''t
  know its other pins are joined inside.'
parts:
  Pico:
    symbol: MCU_Module:RaspberryPi_Pico
    at: b5
    rot: 0
  SW1:
    type: dip
    pins: 4
    title: tactile switch
    at: f29
    rot: 180
  R1:
    type: resistor
    value: 10k
    pins:
    - j11
    - top-11
  R2:
    type: resistor
    value: 330R
    pins:
    - h1
    - h3
  D1:
    type: led
    pins:
    - j3
    - top-3
nets:
  3V3:
    pins:
    - Pico.3V3
    - SW1.2
    rail: +
  BTN:
  - Pico.GPIO28_ADC2
  - SW1.1
  - R1.1
  LED_DRIVE:
  - Pico.GPIO27_ADC1
  - R2.1
  LED:
  - R2.2
  - D1.A
  GND:
    pins:
    - Pico.GND
    - R1.2
    - D1.K
    rail: '-'
expect:
  label_clashes: 0
autowire: true
_placed:
- Pico
- SW1
- R1
- R2
- D1
