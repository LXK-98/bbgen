title: 8-bit register module (Ben Eater)
notes:
- Tier 4. Two 74LS173s hold the low and high nibbles from the bus; a 74LS245 puts
  them back on the bus when /ENABLE is low. LEDs show the register. Outputs always
  enabled (M to GND), A to B always.
