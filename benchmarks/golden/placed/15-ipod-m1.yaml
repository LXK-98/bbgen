    symbol: MCU_Module:RaspberryPi_Pico
    footprint: Module:RaspberryPi_Pico_Common_THT
    at: i60
    rot: 180
  U12:
    symbol: Regulator_Linear:ME6211C30M5
    adapter:
      pins: 6
      map:
        '5': 6
    at: e35
    rot: 0
  U11:
    symbol: Regulator_Linear:AP2112K-1.8
    adapter:
      pins: 6
      map:
        '5': 6
    at: e29
    rot: 0
  U13:
    symbol: Amplifier_Operational:TLV9061xDBV
    adapter:
      pins: 6
      map:
        '5': 6
    at: e22
    rot: 0
  RV1:
    footprint: Potentiometer_THT:Potentiometer_Bourns_3296W_Vertical
    title: 3296W 10k
    at: j18
    rot: 90
  R1:
    type: resistor
    value: 10k
    pins:
    - i22
    - i20
  R2:
    type: resistor
    value: 10k
