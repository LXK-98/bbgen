title: ESP32 DevKitC on one board, wired under it, with sensor, LED, button and OLED
notes:
- 'Tier 4. 17''s circuit on one board. The ESP32-DevKitC''s rows are 1.0 in apart,
  so on one board its body covers one side''s strips whole; it stands on its headers,
  though, so flat wires laid before it go in run under it (raised: true). It reads
  a DS18B20 on IO15 (4.7k pull-up), lights an LED on IO2, reads a button on IO4 (10k
  pull-up) and drives an SSD1306 OLED on I2C (IO21/IO22).'
