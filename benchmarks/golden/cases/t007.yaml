parts:
  Pico:
    type: pico
    at: h3
  U1:
    type: dip
    pins: 6
    labels:
    - VIN
    - GND
    - EN
    - X
    - Y
    - VOUT
  R1:
    type: resistor
    value: 10k
  C1:
    type: capacitor
    value: 1uF
nets:
  VSYS:
  - Pico.VSYS
  - U1.VIN
  - C1.1
  GND:
  - Pico.GND
  - U1.GND
  - R1.2
  - C1.2
  EN:
  - Pico.GP21
  - U1.EN
  - R1.1
