title: Pico + I2C EEPROM
notes:
- The LED's long leg is the anode.
boards:
- type: full
  rails:
    top: +-
    bottom: +-
  split_rails: false
parts:
  Pico:
    type: pico
    at: c3
  U1:
    type: dip
    pins: 8
    width: 3
    at: e30
    title: 24LC256
    labels:
    - A0
    - A1
    - A2
    - GND
    - SDA
    - SCL
    - WP
    - VCC
  R1:
    type: resistor
    value: 330R
    pins:
    - Pico.GP15
    - a27
  D1:
    type: led
    pins:
    - R1.2
    - bot-
  C1:
    type: capacitor
    value: 100nF
    pins:
    - top+33
    - top-33
  J1:
    type: offboard
    title: Logic analyzer
    cols: 2
    labels:
      1: SDA
      2: SCL
      3: GND
      4: 5V!
wires:
  power:
  - - Pico.3V3
    - top+
  - - Pico.38
    - top-
  - - Pico.3
    - bot-
  - - U1.VCC
    - top+
  - - U1.GND
    - bot-
    - black
  i2c:
  - - Pico.GP16
    - U1.SDA
  - - Pico.GP17
    - U1.SCL
  - - U1.SDA
    - J1.SDA
  - - U1.SCL
    - J1.SCL
  - - bot-
    - J1.GND
nets:
  3V3:
    pins:
    - Pico.3V3
    - U1.VCC
    - C1.1
    color: red
  GND:
  - Pico.GND
  - U1.GND
  - C1.2
  - D1.K
  - J1.GND
  SDA:
  - Pico.GP16
  - U1.SDA
  - J1.SDA
  SCL:
  - Pico.GP17
  - U1.SCL
  - J1.SCL
  LED_DRIVE:
  - Pico.GP15
  - R1.1
  LED:
  - R1.2
  - D1.A
