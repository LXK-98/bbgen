# A strip of every third column holds an LED's anode, placed by hand, and no pin of the chip is in their net, so
# the chip has nowhere to go: placement says so, naming the LEDs, instead of shorting into them.
title: No room left for the chip
boards: [half]
parts:
  U1: {type: dip, pins: 8, labels: [GND, TRIG, OUT, RST, CTRL, THR, DIS, VCC]}
  L1: {type: led, pins: [a3, top-]}
  L2: {type: led, pins: [a6, top-]}
  L3: {type: led, pins: [a9, top-]}
  L4: {type: led, pins: [a12, top-]}
  L5: {type: led, pins: [a15, top-]}
  L6: {type: led, pins: [a18, top-]}
  L7: {type: led, pins: [a21, top-]}
  L8: {type: led, pins: [a24, top-]}
  L9: {type: led, pins: [a27, top-]}
  L10: {type: led, pins: [a30, top-]}
nets:
  GND: {pins: [U1.GND, L1.K, L2.K, L3.K, L4.K, L5.K, L6.K, L7.K, L8.K, L9.K, L10.K], rail: -}
  VCC: {pins: [U1.VCC, U1.RST], rail: +}
  OUT: [U1.OUT]
  ANODES: [L1.A, L2.A, L3.A, L4.A, L5.A, L6.A, L7.A, L8.A, L9.A, L10.A]
  TIMING: [U1.TRIG, U1.THR, U1.DIS]
  CTRL: [U1.CTRL]
