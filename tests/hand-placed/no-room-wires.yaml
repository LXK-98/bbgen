# As no-room.yaml, with one LED and a chain of wires from its strip: each wire end's strip carries the LED's
# net, so the chip has nowhere to go.
title: No room left for the chip, by wires
boards: [half]
parts:
  U1: {type: dip, pins: 8, labels: [GND, TRIG, OUT, RST, CTRL, THR, DIS, VCC]}
  L1: {type: led, pins: [j3, top-]}
wires:
  - [i3, j6]
  - [i6, j9]
  - [i9, j12]
  - [i12, j15]
  - [i15, j18]
  - [i18, j21]
  - [i21, j24]
  - [i24, j27]
  - [i27, j30]
nets:
  GND: {pins: [U1.GND, L1.K], rail: -}
  VCC: {pins: [U1.VCC, U1.RST], rail: +}
  OUT: [U1.OUT]
  ANODE: [L1.A]
  TIMING: [U1.TRIG, U1.THR, U1.DIS]
  CTRL: [U1.CTRL]
