title: Knight Rider LED runner (8 LEDs)
notes:
- 9 V battery (or 9 V bench supply) on J1. All chips are CD4000-series CMOS, fine
  from 5 V to 15 V.
- U1 (NE555) clocks U2 (CD4040) at about 15 Hz (R1 1k, R2 47k, C1 1uF).
- 'U3 (CD4070) XORs counter bits Q1-Q3 with Q4, so U4 (CD4028) counts 0..7 then 7..0:
  the light runs back and forth.'
- Unused XOR gate inputs (U3 pins 12, 13) are tied to ground; the 4028's D input is
  tied to ground.
- 'LEDs: long leg (anode) in row a, short leg (cathode) in the ground rail beside
  it.'
