name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bbgen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # the tests build circuits with parts from KiCad's library, at the version their records were made with
      - name: KiCad's symbol and footprint libraries
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get install -y -qq --no-install-recommends kicad-symbols kicad-footprints
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked

  studio:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
